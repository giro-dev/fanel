name: Release
# Triggered by pushing a vX.Y.Z tag. Builds the versioned Docker image, the
# (unsigned) Android debug APK, and publishes both as a GitHub Release with
# autogenerated notes. See ADR 0010 for the distribution strategy.
on:
  push:
    tags: ['v*.*.*']

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/giro-dev/fanel:${{ github.ref_name }}

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
      - run: cp app/build/outputs/apk/debug/app-debug.apk "fanel-android-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/fanel-android-${{ github.ref_name }}.apk

  github-release:
    needs: [docker-image, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: softprops/action-gh-release@v2
        with:
          name: Fanel ${{ github.ref_name }}
          generate_release_notes: true
          files: fanel-android-${{ github.ref_name }}.apk
          body: |
            Imatge Docker: `ghcr.io/giro-dev/fanel:${{ github.ref_name }}`

            L'APK adjunt és una build de **debug sense signar**, pensada per a
            sideload familiar/personal (vegeu [ADR 0010](https://giro-dev.github.io/fanel/docs/adr/0010-distribucio-i-releases/)).
