name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver X.Y.Z). Empty = pom version without -SNAPSHOT"
        required: false
        type: string
      play_track:
        description: "Also upload the AAB to this Play Console track (none = skip)"
        required: false
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production
        default: none
      play_status:
        description: "Play release status. While the app is still a draft in Play Console only 'draft' is accepted"
        required: false
        type: choice
        options:
          - draft
          - completed
        default: draft

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSIONS_PLUGIN: org.codehaus.mojo:versions-maven-plugin:2.18.0

jobs:
  # Sets the release version in the Maven poms and the Android project,
  # commits and tags vX.Y.Z so the artifact jobs build from an immutable ref.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - id: vars
        run: |
          INPUT="${{ inputs.version }}"
          VERSION="${INPUT#v}"
          if [ -z "$INPUT" ]; then
            CURRENT=$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
            if [[ "$CURRENT" != *-SNAPSHOT ]]; then
              echo "::error::No version input and project version '$CURRENT' is not a -SNAPSHOT"
              exit 1
            fi
            VERSION="${CURRENT%-SNAPSHOT}"
            echo "Derived version $VERSION from pom ($CURRENT)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected semver X.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set release version (Maven + Android)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mvn -B -ntp "$VERSIONS_PLUGIN:set" -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          sed -i "s/versionCode = [0-9]\+/versionCode = $CODE/" android/app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" android/app/build.gradle.kts
      - name: Commit and tag
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml backend/pom.xml frontend/pom.xml android/app/build.gradle.kts
          git diff --cached --quiet || git commit -m "chore: release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"

  jar:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp package -DskipTests
      - run: cp backend/target/fanel-backend-*.jar "fanel-${{ needs.prepare.outputs.version }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: fanel-*.jar

  apk:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      FANEL_KEYSTORE_PASSWORD: ${{ secrets.FANEL_KEYSTORE_PASSWORD }}
      FANEL_KEY_ALIAS: ${{ secrets.FANEL_KEY_ALIAS }}
      FANEL_KEY_PASSWORD: ${{ secrets.FANEL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # Gradle 8.14 does not run on JDK 25; the app targets Java 21 anyway.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest ships a full Android SDK at $ANDROID_HOME; sdkmanager is
      # not on PATH, it lives under cmdline-tools/*/bin.
      - run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      # Optional: if FANEL_KEYSTORE_BASE64 secret is set, use that key instead of
      # the self-signed dev keystore committed at android/app/selfsigned.jks.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FANEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fanel.jks"
            echo "FANEL_KEYSTORE=$RUNNER_TEMP/fanel.jks" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon assembleRelease
        working-directory: android
      - name: Build release App Bundle
        run: ./gradlew --no-daemon bundleRelease
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk "fanel-${{ needs.prepare.outputs.version }}.apk"
      - run: cp android/app/build/outputs/bundle/release/app-release.aab "fanel-${{ needs.prepare.outputs.version }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: fanel-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: fanel-*.aab

  docker:
    needs: [prepare, jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # Reuse the jar built by the jar job: the Dockerfile skips the Maven
      # build when backend/target/fanel-backend-*.jar is present.
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist
      - run: |
          mkdir -p backend/target
          cp "dist/fanel-${{ needs.prepare.outputs.version }}.jar" \
             "backend/target/fanel-backend-${{ needs.prepare.outputs.version }}.jar"
      - name: Resolve image name
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "DOCKER_IMAGE=${DOCKERHUB_IMAGE:-$DOCKERHUB_USERNAME/fanel}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
      # Keep the Docker Hub overview in sync with DOCKERHUB.md
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          readme-filepath: ./DOCKERHUB.md

  publish:
    needs: [prepare, jar, apk]
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes needs a local git repo.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: aab
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/*.jar dist/*.apk dist/*.aab \
            --title "Fanel $TAG" \
            --generate-notes \
            --verify-tag

  playstore:
    needs: [prepare, publish]
    if: inputs.play_track != 'none' && inputs.play_track != ''
    uses: ./.github/workflows/playstore-publish.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ inputs.play_track }}
      status: ${{ inputs.play_status || 'draft' }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # After a successful release, bump everything to the next -SNAPSHOT on the
  # source branch so the repository is ready for the following release.
  bump:
    # needs prepare too: needs.* context only exposes jobs listed here,
    # and this job reads needs.prepare.outputs.version.
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compute next snapshot version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "NEXT=$MAJOR.$MINOR.$(( PATCH + 1 ))" >> "$GITHUB_ENV"
      - name: Set next snapshot version (Maven + Android)
        run: |
          mvn -B -ntp "$VERSIONS_PLUGIN:set" -DnewVersion="$NEXT-SNAPSHOT" -DgenerateBackupPoms=false
          IFS=. read -r MAJOR MINOR PATCH <<< "$NEXT"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          sed -i "s/versionCode = [0-9]\+/versionCode = $CODE/" android/app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$NEXT-SNAPSHOT\"/" android/app/build.gradle.kts
      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml backend/pom.xml frontend/pom.xml android/app/build.gradle.kts
          git diff --cached --quiet || git commit -m "chore: prepare next development iteration ($NEXT-SNAPSHOT)"
          git push origin "HEAD:refs/heads/$BRANCH"
