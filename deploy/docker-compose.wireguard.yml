services:
  app:
    network_mode: host
    cap_add:
      - NET_ADMIN
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      FANEL_DB_URL: jdbc:postgresql://127.0.0.1:5432/fanel
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /certs/fanel-tls.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_STORE_PASSWORD: ${FANEL_TLS_KEYSTORE_PASSWORD}
      MANAGEMENT_SERVER_PORT: "8080"
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      MANAGEMENT_SERVER_SSL_ENABLED: "false"
      FANEL_WG_ENABLED: "true"
      FANEL_WG_INTERFACE: ${FANEL_WG_INTERFACE:-wg0}
      FANEL_WG_NETWORK: ${FANEL_WG_NETWORK:-10.8.0.0/24}
      FANEL_WG_SERVER_ADDRESS: ${FANEL_WG_SERVER_ADDRESS:-10.8.0.1}
      FANEL_WG_ENDPOINT: ${FANEL_WG_ENDPOINT}
      FANEL_WG_LAN_BASE_URL: ${FANEL_WG_LAN_BASE_URL}
      FANEL_WG_TUNNEL_BASE_URL: ${FANEL_WG_TUNNEL_BASE_URL:-https://10.8.0.1:8443}
      FANEL_WG_ALLOWED_IPS: ${FANEL_WG_ALLOWED_IPS:-10.8.0.0/24}
      FANEL_WG_KEEPALIVE: ${FANEL_WG_KEEPALIVE:-25}
      FANEL_WG_USE_PSK: ${FANEL_WG_USE_PSK:-true}
      FANEL_WG_PSK_KEY: ${FANEL_WG_PSK_KEY}
      FANEL_WG_COMMAND: ${FANEL_WG_COMMAND:-/usr/bin/wg}
      FANEL_WG_COMMAND_TIMEOUT: ${FANEL_WG_COMMAND_TIMEOUT:-5s}
      FANEL_WG_PAIRING_TOKEN_TTL: ${FANEL_WG_PAIRING_TOKEN_TTL:-10m}
      FANEL_WG_TLS_SPKI_SHA256: ${FANEL_WG_TLS_SPKI_SHA256}
      FANEL_WG_SERVER_ID: ${FANEL_WG_SERVER_ID}
      FANEL_WG_RECONCILE_INTERVAL: ${FANEL_WG_RECONCILE_INTERVAL:-5m}
      FANEL_WG_REMOVE_UNKNOWN_PEERS: ${FANEL_WG_REMOVE_UNKNOWN_PEERS:-false}
      FANEL_WG_ENROLL_PRIVATE_ONLY: ${FANEL_WG_ENROLL_PRIVATE_ONLY:-false}
      FANEL_WG_TRUSTED_PROXIES: ${FANEL_WG_TRUSTED_PROXIES:-}
      FANEL_WG_ENROLL_RATE_LIMIT_PER_MINUTE: ${FANEL_WG_ENROLL_RATE_LIMIT_PER_MINUTE:-5}
      FANEL_WG_ENFORCE_TUNNEL_PEER: ${FANEL_WG_ENFORCE_TUNNEL_PEER:-true}
      FANEL_WG_ALLOW_ADMIN_FROM_TUNNEL: ${FANEL_WG_ALLOW_ADMIN_FROM_TUNNEL:-false}
    volumes:
      - ./certs:/certs:ro
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
