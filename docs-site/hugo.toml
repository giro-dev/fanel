baseURL = "/"
title = "Fanel"

defaultContentLanguage = "ca"
defaultContentLanguageInSubdir = true

[languages]
  [languages.ca]
    label = "Català"
    contentDir = "content/ca"
    weight = 1
  [languages.es]
    label = "Español"
    contentDir = "content/es"
    weight = 2

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min = "0.160.1"
  [[module.imports]]
    path = "github.com/google/docsy/theme"
    disable = false

[params]
  copyright = "giro-dev"
  github_repo = "https://github.com/giro-dev/fanel"
  github_subdir = "docs-site"
  [params.ui]
    breadcrumb_disable = false
    sidebar_menu_compact = true
    sidebar_menu_foldable = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"
